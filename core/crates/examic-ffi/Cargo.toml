[package]
name = "examic-ffi"
description = "The native library loaded by the Android app: engine, UniFFI control API and JNI audio path"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "examic_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
examic-audio.workspace = true
examic-db.workspace = true
examic-asr.workspace = true
examic-mt.workspace = true
ogg = "0.9"
uniffi = "0.32"
jni-sys = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror.workspace = true
log.workspace = true

# libopus, transcribe.cpp and the ONNX Runtime bindings need CMake or a
# runtime library, so only the shipped library is built with them. Anywhere
# else the crate exists to run the engine's tests, which use stand-ins.
[target.'cfg(target_os = "android")'.dependencies]
examic-audio = { workspace = true, features = ["opus"] }
examic-asr = { workspace = true, features = ["native"] }
examic-mt = { workspace = true, features = ["native"] }
opus = "0.4"
libc = "0.2"
android_logger = { version = "0.15", default-features = false }
