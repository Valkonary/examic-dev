[package]
name = "examic-db"
description = "Encrypted SQLite store for recordings, bookmarks and speech intervals"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `sqlcipher` makes rusqlite link a library named `sqlcipher` instead of
# building plain SQLite; examic-sqlcipher is what provides that library.
rusqlite = { version = "0.42", features = ["sqlcipher", "modern_sqlite"] }
examic-sqlcipher.workspace = true
thiserror.workspace = true
zeroize.workspace = true
