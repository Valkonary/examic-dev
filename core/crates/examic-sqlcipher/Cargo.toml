[package]
name = "examic-sqlcipher"
description = "Builds SQLCipher with the libtomcrypt crypto provider, so no OpenSSL is needed"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
# Pinned to the release libsqlite3-sys generated its bundled bindings from.
sqlcipher-src = "=420.0.0"
